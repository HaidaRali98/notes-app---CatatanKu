<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-bar
      app-title="Catatanku"
      subtitle="Tulis, simpan, dan baca ulang ide-idemu."
    ></app-bar>

    <main class="layout">
      <section class="layout__form" aria-label="Tambah catatan">
        <note-form title-limit="50" body-min="10"></note-form>
      </section>

      <section class="layout__list" aria-label="Daftar catatan">
        <h2 class="section-title">Catatan <span id="noteCount"></span></h2>
        <div class="tabs" role="group" aria-label="Filter catatan">
          <button class="tabs__button" data-view="active" aria-pressed="true">
            Aktif
          </button>
          <button
            class="tabs__button"
            data-view="archived"
            aria-pressed="false"
          >
            Arsip
          </button>
        </div>
        <loading-indicator label="Memuat data..."></loading-indicator>
        <note-list></note-list>
      </section>
    </main>
  </body>
</html>
